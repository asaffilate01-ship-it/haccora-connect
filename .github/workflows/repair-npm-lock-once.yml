name: Prepare npm lockfile repair

on:
  push:
    branches:
      - fix/20261005-npm-lock-alignment
    paths:
      - .github/workflows/repair-npm-lock-once.yml

permissions:
  contents: write

concurrency:
  group: haccora-npm-lock-repair-20261005
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/20261005-npm-lock-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Generate npm lock with declared toolchain and no lifecycle scripts
        run: |
          set -euo pipefail
          npx --yes --package=npm@10.9.4 npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json bun.lock
          test "$(git diff --name-only)" = 'package-lock.json'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const group of ['dependencies', 'devDependencies']) {
            assert.deepEqual(lock.packages[''][group], manifest[group]);
          }
          for (const name of ['@tanstack/react-router', '@tanstack/react-start', '@tanstack/router-plugin']) {
            assert.equal(lock.packages['node_modules/' + name].version, manifest.dependencies[name]);
          }
          NODE
      - name: Commit only generated lock to isolated repair branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/20261005-npm-lock-alignment | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'fix: align npm lockfile with approved manifest and TanStack pins'
          git push origin HEAD:refs/heads/fix/20261005-npm-lock-alignment
          git rev-parse HEAD
