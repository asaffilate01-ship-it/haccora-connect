name: Native internal candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Signed internal candidate platform
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      deployment_url:
        description: HTTPS staging application URL embedded in the candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: haccora-native-internal-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HACCORA_ENV: staging
      # EAS CLI consumes EXPO_TOKEN; keep one canonical protected secret name
      # across launch validation and native candidate builds.
      EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      EAS_CLI_VERSION: ${{ vars.EAS_CLI_VERSION }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_WEB_APP_URL: ${{ inputs.deployment_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify and export the native source
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          npm ci
          npm run release:internal-preflight
          npm run typecheck
          npm run export:check
      - name: Install the explicitly approved EAS CLI
        run: npm install --global "eas-cli@${EAS_CLI_VERSION}"
      - name: Build a signed internal candidate
        working-directory: mobile
        run: |
          mkdir -p ../release-evidence
          eas build --platform "${{ inputs.platform }}" --profile preview \
            --non-interactive --wait --json > ../release-evidence/eas-internal-build.raw.json
      - name: Verify and redact signed-build evidence
        working-directory: mobile
        env:
          EAS_BUILD_RESULT_FILE: ../release-evidence/eas-internal-build.raw.json
          EAS_BUILD_MANIFEST_FILE: ../release-evidence/eas-internal-build.json
          EAS_EXPECTED_PLATFORM: ${{ inputs.platform }}
          HACCORA_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:verify-build
      - name: Upload signed-build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: haccora-native-internal-${{ inputs.platform }}-${{ github.sha }}
          path: release-evidence/eas-internal-build.json
          if-no-files-found: error
          retention-days: 30
