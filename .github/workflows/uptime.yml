name: Production uptime

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report monitoring configuration
        env:
          CONFIGURED_PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://haccora.co.uk' }}
          OPERATIONS_HEALTH_URL: ${{ vars.OPERATIONS_HEALTH_URL }}
          CONFIGURED_PRODUCTION_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA }}
          PRODUCTION_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA || github.sha }}
          PRODUCTION_PUBLIC_LAUNCH: ${{ vars.PRODUCTION_PUBLIC_LAUNCH }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          launch_monitoring_missing=false
          if [ -z "$CONFIGURED_PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL is not configured; monitoring the canonical haccora.co.uk URL."
            echo "Canonical production monitoring is active; configure PRODUCTION_URL explicitly to remove this warning." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production probes are enabled for the configured URL." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$OPERATIONS_HEALTH_URL" ]; then
            echo "::warning::OPERATIONS_HEALTH_URL is not configured; scheduler and queue probes are disabled."
            echo "Set the operations-health URL and dedicated OPERATIONS_MONITOR_SECRET to monitor production jobs." >> "$GITHUB_STEP_SUMMARY"
            launch_monitoring_missing=true
          else
            echo "Scheduler heartbeat and dead-letter probes are enabled." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$CONFIGURED_PRODUCTION_RELEASE_SHA" ]; then
            echo "Release drift monitoring is using the current main commit until PRODUCTION_RELEASE_SHA is configured." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Supabase public health variables are not configured; authentication monitoring is disabled."
            launch_monitoring_missing=true
          fi
          if [ "$PRODUCTION_PUBLIC_LAUNCH" != "true" ]; then
            echo "Public launch readiness enforcement remains disabled until PRODUCTION_PUBLIC_LAUNCH is true." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$launch_monitoring_missing" = "true" ]; then
            echo "::error::Public launch monitoring is incomplete. Configure authentication and operations probes."
            exit 1
          fi

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://haccora.co.uk' }}
      EXPECTED_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/check-deployment-health.mjs
      - run: node scripts/check-deployment-smoke.mjs

  authentication:
    if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/check-supabase-auth-health.mjs

  readiness:
    if: ${{ vars.PRODUCTION_PUBLIC_LAUNCH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://haccora.co.uk' }}
      EXPECTED_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/check-deployment-readiness.mjs

  operations:
    if: ${{ vars.OPERATIONS_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPERATIONS_HEALTH_URL: ${{ vars.OPERATIONS_HEALTH_URL }}
      OPERATIONS_MONITOR_SECRET: ${{ secrets.OPERATIONS_MONITOR_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/check-operations-health.mjs
