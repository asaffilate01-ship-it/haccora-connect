name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          output: codeql-results
      - name: Report security finding locations
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          if (!existsSync('codeql-results')) process.exit(0);
          for (const file of readdirSync('codeql-results').filter((name) => name.endsWith('.sarif'))) {
            const report = JSON.parse(readFileSync(`codeql-results/${file}`, 'utf8'));
            for (const run of report.runs ?? []) {
              for (const result of run.results ?? []) {
                console.log(JSON.stringify({ rule: result.ruleId, message: result.message?.text, locations: result.locations }));
              }
            }
          }
          NODE
