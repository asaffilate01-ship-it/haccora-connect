name: Production scheduled dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Require protected production scheduler configuration
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Set the SUPABASE_URL repository variable."; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::Set the CRON_SECRET repository secret."; exit 1; }
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL must be an HTTPS Supabase project origin."; exit 1 ;;
          esac

  core-dispatchers:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *' }}
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: production-core-dispatchers
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run file, operations and integration dispatchers
        run: |
          set -euo pipefail
          for function_name in file-scan operations-dispatch integration-dispatch; do
            status="$(curl --silent --show-error --retry 2 --max-time 45 \
              --output /dev/null --write-out '%{http_code}' \
              --request POST "${SUPABASE_URL%/}/functions/v1/${function_name}" \
              --header "x-cron-secret: ${CRON_SECRET}" \
              --header "content-type: application/json" \
              --data '{}')"
            case "$status" in
              2??) echo "${function_name}: ${status}" ;;
              *) echo "::error::${function_name} returned HTTP ${status}"; exit 1 ;;
            esac
          done

  notification-dispatcher:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '2,17,32,47 * * * *' }}
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: production-notification-dispatcher
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run notification dispatcher
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 2 --max-time 90 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST "${SUPABASE_URL%/}/functions/v1/notification-dispatch" \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --header "content-type: application/json" \
            --data '{}')"
          case "$status" in
            2??) echo "notification-dispatch: ${status}" ;;
            *) echo "::error::notification-dispatch returned HTTP ${status}"; exit 1 ;;
          esac
