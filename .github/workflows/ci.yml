name: Production checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Block generated authentication or brand drift before installing dependencies
        run: npm run source:integrity
      - name: Verify every third-party workflow action is commit-pinned
        run: npm run actions:check

  web:
    needs: release-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run verify
      - run: npm run migrations:check
      - run: npm run secrets:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          PUBLIC_MARKETING_URL: https://marketing.example.com
          PUBLIC_APP_URL: https://example.com

  mobile:
    needs: release-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run runtime:preflight
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          EXPO_PUBLIC_WEB_APP_URL: https://ci.haccora.invalid
      - run: npm run export:check
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          EXPO_PUBLIC_WEB_APP_URL: https://ci.haccora.invalid

  edge-functions:
    needs: release-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/functions/package-lock.json
      - run: npm ci
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.4
      - run: deno fmt --check .
      - run: deno lint .
      - run: deno test --node-modules-dir=manual --no-lock _shared/provider-readiness.test.ts
      - run: >-
          deno check --node-modules-dir=manual --no-lock
          contact/index.ts
          inspector-invite/index.ts
          inspection-export/index.ts
          notification-dispatch/index.ts
          sensor-ingest/index.ts
          sensor-provision/index.ts
          team-invite/index.ts
          platform-admin/index.ts
          platform-readiness/index.ts
          privacy-requests/index.ts
          security-center/index.ts
          file-scan/index.ts
          operations-dispatch/index.ts
          billing/index.ts
          integration-admin/index.ts
          integration-dispatch/index.ts
          operations-health/index.ts

  browser-e2e:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          PUBLIC_MARKETING_URL: https://marketing.example.com
          PUBLIC_APP_URL: https://example.com
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
