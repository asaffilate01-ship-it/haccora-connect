name: Phase 57 one-time formatting
# Second pass after allergen and queue hardening
on:
  push:
    branches: [feature/haccora-supplier-controls-mobile-security-oct2026]
    paths: [.github/workflows/phase57-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prettier on changed Phase 57 source
        run: |
          npx prettier --write src/components/ppds/IngredientChangeReview.tsx src/routes/app.ppds.tsx tests/supplier-change-approval.test.mjs docs/PHASE-57-SUPPLIER-CHANGE-AND-MOBILE-SECURITY.md mobile/package.json
      - name: Commit format-only changes
        run: |
          git config user.name 'Haccora CI Formatter'
          git config user.email 'haccora-ci@users.noreply.github.com'
          git add src/components/ppds/IngredientChangeReview.tsx src/routes/app.ppds.tsx tests/supplier-change-approval.test.mjs docs/PHASE-57-SUPPLIER-CHANGE-AND-MOBILE-SECURITY.md mobile/package.json
          if ! git diff --cached --quiet; then
            git commit -m 'style: format phase 57 supplier review source'
            git push origin HEAD:feature/haccora-supplier-controls-mobile-security-oct2026
          fi
