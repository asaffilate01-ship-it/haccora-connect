name: Deploy production Supabase

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Enter the production Supabase project ref to authorize this deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Verify production target and source gates
        env:
          CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          test -n "$PRODUCTION_PROJECT_REF"
          test "$CONFIRMED_PROJECT_REF" = "$PRODUCTION_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)" = "$PRODUCTION_PROJECT_REF"
          npm ci
          npm run migrations:check
          npm run secrets:check

      - name: Link the protected production project
        run: >-
          supabase link
          --project-ref "$PRODUCTION_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Archive pre-deployment migration ledger
        run: |
          mkdir -p production-release-evidence
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            > production-release-evidence/production-migration-list-before.txt

      - name: Preview forward-only migration plan
        run: supabase db push --dry-run --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Apply forward-only migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Reconcile and archive applied migration ledger
        env:
          HACCORA_EVIDENCE_DIR: production-release-evidence
          MIGRATION_LIST_FILE: production-release-evidence/production-migration-list.txt
          MIGRATION_TARGET: production
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            > "$MIGRATION_LIST_FILE"
          node scripts/verify-remote-migration-ledger.mjs

      - name: Deploy every Edge Function
        run: supabase functions deploy --project-ref "$PRODUCTION_PROJECT_REF"

      - name: Inventory deployed Edge Functions
        run: |
          supabase functions list --project-ref "$PRODUCTION_PROJECT_REF" \
            > production-release-evidence/functions-list.txt
          for name in billing contact dokuvera-admin dokuvera-webhook file-scan inspection-export inspector-invite integration-admin integration-dispatch notification-dispatch operations-dispatch operations-health platform-admin platform-readiness privacy-requests security-center sensor-ingest sensor-provision team-invite; do
            grep -q "$name" production-release-evidence/functions-list.txt
          done

      - name: Retain production migration and function evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-supabase-${{ github.sha }}
          path: production-release-evidence/
          if-no-files-found: warn
          retention-days: 90
