name: Production release evidence

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS URL of the deployed release candidate to verify
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  id-token: write
  attestations: write

concurrency:
  group: production-release-readiness
  cancel-in-progress: false

jobs:
  release-readiness:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      PUBLIC_MARKETING_URL: ${{ vars.PUBLIC_MARKETING_URL }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      OPERATIONS_HEALTH_URL: ${{ vars.OPERATIONS_HEALTH_URL }}
      PRODUCTION_URL: ${{ inputs.deployment_url }}
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      MALWARE_SCAN_URL: ${{ vars.MALWARE_SCAN_URL }}
      MALWARE_SCAN_TOKEN: ${{ secrets.MALWARE_SCAN_TOKEN }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_WEB_APP_URL: ${{ inputs.deployment_url }}
      VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
      VITE_STATUS_URL: ${{ vars.VITE_STATUS_URL }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
      WEB_PUSH_GATEWAY_URL: ${{ vars.WEB_PUSH_GATEWAY_URL }}
      WEB_PUSH_GATEWAY_TOKEN: ${{ secrets.WEB_PUSH_GATEWAY_TOKEN }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: ${{ vars.NOTIFICATION_FROM_EMAIL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_SOLO: ${{ vars.STRIPE_PRICE_SOLO }}
      STRIPE_PRICE_COMPLETE: ${{ vars.STRIPE_PRICE_COMPLETE }}
      STRIPE_PRICE_GROUP: ${{ vars.STRIPE_PRICE_GROUP }}
      STRIPE_LIVE_MODE: ${{ vars.STRIPE_LIVE_MODE }}
      CONTACT_HASH_SALT: ${{ secrets.CONTACT_HASH_SALT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPERATIONS_MONITOR_SECRET: ${{ secrets.OPERATIONS_MONITOR_SECRET }}
      INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
      VITE_LEGAL_COMPANY_NAME: ${{ vars.VITE_LEGAL_COMPANY_NAME }}
      VITE_LEGAL_ADDRESS_LINE_1: ${{ vars.VITE_LEGAL_ADDRESS_LINE_1 }}
      VITE_LEGAL_POSTAL_CITY: ${{ vars.VITE_LEGAL_POSTAL_CITY }}
      VITE_LEGAL_REGISTERED_IN: ${{ vars.VITE_LEGAL_REGISTERED_IN }}
      VITE_LEGAL_COMPANY_NUMBER: ${{ vars.VITE_LEGAL_COMPANY_NUMBER }}
      VITE_LEGAL_EMAIL: ${{ vars.VITE_LEGAL_EMAIL }}
      VITE_LEGAL_PHONE: ${{ vars.VITE_LEGAL_PHONE }}
      VITE_LEGAL_VAT_ID: ${{ vars.VITE_LEGAL_VAT_ID }}
      VITE_LEGAL_ICO_REGISTRATION: ${{ vars.VITE_LEGAL_ICO_REGISTRATION }}
      VITE_LEGAL_CONTENT_APPROVED: ${{ vars.VITE_LEGAL_CONTENT_APPROVED }}
      LEGAL_COUNSEL_APPROVAL_REFERENCE: ${{ vars.LEGAL_COUNSEL_APPROVAL_REFERENCE }}
      LEGAL_COUNSEL_APPROVED_AT: ${{ vars.LEGAL_COUNSEL_APPROVED_AT }}
      LEGAL_ICO_FEE_STATUS_CONFIRMED: ${{ vars.LEGAL_ICO_FEE_STATUS_CONFIRMED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.4
      - run: npm ci
      - run: npm run audit:production
      - run: npm run launch:preflight
      - run: npm run quality
      - name: Verify native release bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          npm ci
          npm run typecheck
          npm run export:check
          npm run release:preflight
      - name: Verify Edge Functions release bundle
        working-directory: supabase/functions
        run: |
          npm ci
          deno fmt --check .
          deno lint .
          deno test --node-modules-dir=manual --no-lock _shared/provider-readiness.test.ts
          deno check --node-modules-dir=manual --no-lock \
            contact/index.ts inspector-invite/index.ts inspection-export/index.ts \
            notification-dispatch/index.ts sensor-ingest/index.ts sensor-provision/index.ts \
            team-invite/index.ts platform-admin/index.ts platform-readiness/index.ts \
            privacy-requests/index.ts security-center/index.ts \
            file-scan/index.ts operations-dispatch/index.ts billing/index.ts \
            integration-admin/index.ts integration-dispatch/index.ts \
            dokuvera-admin/index.ts dokuvera-webhook/index.ts \
            operations-health/index.ts
      - name: Verify deployed commit identity and health
        run: npm run health:check
      - name: Verify the configured authentication service is reachable
        run: npm run auth:health
      - name: Verify deployed public runtime readiness
        run: npm run readiness:check
      - name: Smoke-test the deployed release candidate
        run: npm run deployment:smoke
      - name: Run desktop and mobile browser accessibility against production
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.deployment_url }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: release-evidence/hosted-browser-results.json
        run: |
          mkdir -p release-evidence
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify scheduler heartbeats and dead-letter queues
        run: npm run operations:health
      - name: Verify protected human and operational launch acceptance
        env:
          LAUNCH_ACCEPTANCE_JSON: ${{ secrets.LAUNCH_ACCEPTANCE_JSON }}
        run: npm run launch:acceptance
      - name: Generate web, native and Edge SBOMs
        run: npm run release:sbom
      - name: Generate tamper-evident release manifest
        env:
          DEPENDENCY_AUDIT_PASSED: "true"
          LAUNCH_PREFLIGHT_PASSED: "true"
          QUALITY_GATE_PASSED: "true"
          NATIVE_EXPORT_PASSED: "true"
          EDGE_FUNCTIONS_PASSED: "true"
          DEPLOYMENT_HEALTH_PASSED: "true"
          AUTH_HEALTH_PASSED: "true"
          DEPLOYMENT_READINESS_PASSED: "true"
          DEPLOYMENT_SMOKE_PASSED: "true"
          HOSTED_BROWSER_E2E_PASSED: "true"
          OPERATIONS_HEALTH_PASSED: "true"
          LAUNCH_ACCEPTANCE_PASSED: "true"
          SBOM_GENERATED: "true"
        run: npm run release:evidence
      - name: Package the verified release artifact
        run: tar -czf "haccora-production-${GITHUB_SHA}.tar.gz" .output release-evidence
      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: haccora-production-${{ github.sha }}.tar.gz
      - name: Attest aggregate release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: haccora-production-${{ github.sha }}.tar.gz
          sbom-path: release-evidence/sbom-haccora-release.cdx.json
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: haccora-production-${{ github.sha }}
          path: |
            haccora-production-${{ github.sha }}.tar.gz
            release-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Record verified GitHub production deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:record-deployment
