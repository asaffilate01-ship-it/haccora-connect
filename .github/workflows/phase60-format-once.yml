name: Phase 60 one-time formatting
on:
  push:
    branches: [feature/haccora-order-reconciliation-hardening-oct2026]
    paths: [.github/workflows/phase60-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write src/routes/api/integrations/dishbee.ts
          src/components/traceability/DishbeeOrderReconciliation.tsx
          tests/dishbee-order-reconciliation.test.mjs
          tests/dishbee-reconciliation-hardening.test.mjs
          docs/PHASE-60-DISHBEE-RECONCILIATION-HARDENING.md
      - name: Commit formatted source
        run: |
          git config user.name 'Haccora CI Formatter'
          git config user.email 'haccora-ci@users.noreply.github.com'
          git add src/routes/api/integrations/dishbee.ts src/components/traceability/DishbeeOrderReconciliation.tsx tests/dishbee-order-reconciliation.test.mjs tests/dishbee-reconciliation-hardening.test.mjs docs/PHASE-60-DISHBEE-RECONCILIATION-HARDENING.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Haccora reconciliation hardening'
            git push origin HEAD:feature/haccora-order-reconciliation-hardening-oct2026
          fi
