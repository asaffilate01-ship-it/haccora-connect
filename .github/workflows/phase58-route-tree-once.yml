name: Phase 58 one-time route generation
on:
  push:
    branches: [feature/haccora-batch-to-sale-recall-oct2026]
    paths: [.github/workflows/phase58-route-tree-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate TanStack route tree from actual route files
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          PUBLIC_MARKETING_URL: https://marketing.example.com
          PUBLIC_APP_URL: https://example.com
      - name: Commit only generated route definition
        run: |
          git config user.name 'Haccora Routing Bot'
          git config user.email 'haccora-routing@users.noreply.github.com'
          git add src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate TanStack route tree for batch traceability'
            git push origin HEAD:feature/haccora-batch-to-sale-recall-oct2026
          fi
