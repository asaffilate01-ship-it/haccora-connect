name: One-time Haccora documentation formatter
on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-phase61-docs-format.yml"
permissions:
  contents: write
jobs:
  format-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/control-centre-trust-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "docs/2026-10-31-DESIGN-AGENTS-MCP-REVIEW.md" "DESIGN.md" "PRODUCT.md"
      - name: Commit documentation formatting to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/2026-10-31-DESIGN-AGENTS-MCP-REVIEW.md" "DESIGN.md" "PRODUCT.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format country-specific design-review documents"
          git push origin "HEAD:$GITHUB_HEAD_REF"
