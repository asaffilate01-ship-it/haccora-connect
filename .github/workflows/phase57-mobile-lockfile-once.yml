name: Phase 57 mobile lockfile refresh
on:
  push:
    branches: [feature/haccora-supplier-controls-mobile-security-oct2026]
    paths: [.github/workflows/phase57-mobile-lockfile-once.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate mobile lockfile using npm resolution
        run: |
          cd mobile
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json');for(const [n,v] of Object.entries({compression:'1.8.2','shell-quote':'1.11.0','source-map-js':'1.2.2'})){const a=p.packages['node_modules/'+n];if(!a||a.version!==v)throw Error(n+' is not patched: '+a?.version)}"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit validated mobile lockfile to feature branch
        run: |
          git config user.name 'Haccora Security Bot'
          git config user.email 'haccora-security@users.noreply.github.com'
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: refresh patched mobile transitive dependency lockfile'
            git push origin HEAD:feature/haccora-supplier-controls-mobile-security-oct2026
          fi
