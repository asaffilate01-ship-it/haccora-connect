name: Fresh database and RLS checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}
      - run: npm run migrations:check
      - name: Apply every migration to a fresh local database
        run: supabase db start
      - name: Run pgTAP tenant-isolation and privilege checks
        run: supabase test db
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup || true
