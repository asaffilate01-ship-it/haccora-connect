name: Production workflow configuration preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-workflow-configuration-preflight
  cancel-in-progress: false

jobs:
  verify-configuration:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ROLE_ACCEPTANCE_PASSWORD: ${{ secrets.ROLE_ACCEPTANCE_PASSWORD }}
      ROLE_ACCEPTANCE_PLATFORM_OWNER_EMAIL: ${{ vars.ROLE_ACCEPTANCE_PLATFORM_OWNER_EMAIL }}
      ROLE_ACCEPTANCE_OWNER_EMAIL: ${{ vars.ROLE_ACCEPTANCE_OWNER_EMAIL }}
      ROLE_ACCEPTANCE_MANAGER_EMAIL: ${{ vars.ROLE_ACCEPTANCE_MANAGER_EMAIL }}
      ROLE_ACCEPTANCE_CHEF_EMAIL: ${{ vars.ROLE_ACCEPTANCE_CHEF_EMAIL }}
      ROLE_ACCEPTANCE_STAFF_EMAIL: ${{ vars.ROLE_ACCEPTANCE_STAFF_EMAIL }}
      ROLE_ACCEPTANCE_INSPECTOR_EMAIL: ${{ vars.ROLE_ACCEPTANCE_INSPECTOR_EMAIL }}
      ROLE_ACCEPTANCE_ISOLATION_OWNER_EMAIL: ${{ vars.ROLE_ACCEPTANCE_ISOLATION_OWNER_EMAIL }}
    steps:
      - name: Verify protected production values without exposing them
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            SUPABASE_URL SUPABASE_PUBLISHABLE_KEY PRODUCTION_SUPABASE_PROJECT_REF \
            SUPABASE_ACCESS_TOKEN PRODUCTION_SUPABASE_DB_PASSWORD CRON_SECRET \
            ROLE_ACCEPTANCE_PASSWORD ROLE_ACCEPTANCE_PLATFORM_OWNER_EMAIL \
            ROLE_ACCEPTANCE_OWNER_EMAIL ROLE_ACCEPTANCE_MANAGER_EMAIL \
            ROLE_ACCEPTANCE_CHEF_EMAIL ROLE_ACCEPTANCE_STAFF_EMAIL \
            ROLE_ACCEPTANCE_INSPECTOR_EMAIL ROLE_ACCEPTANCE_ISOLATION_OWNER_EMAIL; do
            test -n "${!key}" || { echo "::error::Missing protected configuration: ${key}"; exit 1; }
          done

          test "$PRODUCTION_SUPABASE_PROJECT_REF" = "dbjbhemmtdkzulsxfvmi" || {
            echo "::error::PRODUCTION_SUPABASE_PROJECT_REF does not match the authorised production project."
            exit 1
          }
          test "$SUPABASE_URL" = "https://${PRODUCTION_SUPABASE_PROJECT_REF}.supabase.co" || {
            echo "::error::SUPABASE_URL and PRODUCTION_SUPABASE_PROJECT_REF do not identify the same project."
            exit 1
          }
          test "${#ROLE_ACCEPTANCE_PASSWORD}" -ge 16 || {
            echo "::error::ROLE_ACCEPTANCE_PASSWORD must contain at least 16 characters."
            exit 1
          }

          for key in \
            ROLE_ACCEPTANCE_PLATFORM_OWNER_EMAIL ROLE_ACCEPTANCE_OWNER_EMAIL \
            ROLE_ACCEPTANCE_MANAGER_EMAIL ROLE_ACCEPTANCE_CHEF_EMAIL \
            ROLE_ACCEPTANCE_STAFF_EMAIL ROLE_ACCEPTANCE_INSPECTOR_EMAIL \
            ROLE_ACCEPTANCE_ISOLATION_OWNER_EMAIL; do
            case "${!key}" in
              *@example.test) ;;
              *) echo "::error::${key} must be a designated example.test account."; exit 1 ;;
            esac
          done

          echo "Protected production workflow configuration is complete."
