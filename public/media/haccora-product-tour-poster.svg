<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Haccora product tour</title>
  <desc id="description">A black, red and green Haccora video cover with a play button.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909" />
      <stop offset="0.58" stop-color="#151515" />
      <stop offset="1" stop-color="#c8102e" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="26%" r="60%">
      <stop offset="0" stop-color="#ff6670" stop-opacity=".36" />
      <stop offset="1" stop-color="#ff6670" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <g fill="none" stroke="#ffffff" stroke-opacity=".08">
    <rect x="1040" y="140" width="420" height="620" rx="36" />
    <path d="M1090 225h320M1090 310h230M1090 520h320M1090 605h280" stroke-width="18" stroke-linecap="round" />
  </g>
  <g transform="translate(120 66) scale(.58)">
    <path d="M84 8 146 32v46c0 38-24 66-62 82-38-16-62-44-62-82V32L84 8Z" fill="#c8102e"/>
    <path d="m54 82 20 20 42-48" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="182" y="86" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="2">HACCORA</text>
    <text x="186" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="4.8">SAFE · CLEAN · TRACEABLE</text>
  </g>
  <text x="120" y="360" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800">Food safety,</text>
  <text x="120" y="455" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800">without the paperwork.</text>
  <text x="120" y="530" fill="#d7d7d7" font-family="Arial, Helvetica, sans-serif" font-size="30">See the Haccora workflow in under a minute.</text>
  <g transform="translate(120 625)">
    <circle cx="58" cy="58" r="58" fill="#087a2a" />
    <path d="M48 36l38 22-38 22z" fill="#ffffff" />
    <text x="145" y="70" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Play product tour</text>
  </g>
  <text x="120" y="820" fill="#ffffff" fill-opacity=".68" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4">DIGITAL FOOD SAFETY FOR UK BUSINESSES</text>
</svg>
